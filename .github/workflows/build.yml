name: Build NayaGram APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nvida/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleAfatDebug -x test -x lint --continue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-APK
          path: |
            TMessagesProj_App/build/outputs/apk/
            **/build/outputs/apk/
