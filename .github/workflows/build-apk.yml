name: Build NayaGram APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build NayaGram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================
      # 12. INITIALIZE LIBRARIES
      # =========================
      - name: Initialize native libraries
        run: |
          if [ -f "./run" ]; then
            ./run init libs
          else
            echo "ERROR: ./run script was not found"
            exit 1
          fi

      # =========================
      # 2. INSTALL JAVA
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================
      # 3. INSTALL BUILD TOOLS
      # =========================
      - name: Install native build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            ninja-build \
            yasm \
            golang-go \
            git \
            unzip \
            zip


      # =========================
      # 4. SETUP ANDROID SDK
      # =========================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # =========================
      # 5. ACCEPT LICENSES
      # =========================
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true


      # =========================
      # 6. INSTALL ANDROID COMPONENTS
      # =========================
      - name: Install Android build components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.18.1" \
            "cmake;3.22.1"


      # =========================
      # 7. SET NDK PATH
      # =========================
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NINJA_PATH=$(which ninja)" >> $GITHUB_ENV


      # =========================
      # 8. CHECK PROJECT FILES
      # =========================
      - name: Check project structure
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la

          echo "===== IMPORTANT FOLDERS ====="
          ls -la TMessagesProj || true
          ls -la TMessagesProj_App || true

          echo "===== RUN SCRIPT ====="
          ls -la run || true


      # =========================
      # 9. INITIALIZE SUBMODULES AGAIN
      # =========================
      - name: Initialize Git submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive


      # =========================
      # 10. PREPARE LOCAL PROPERTIES
      # =========================
      - name: Create local.properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -n "$LOCAL_PROPERTIES" ]; then
            printf "%s" "$LOCAL_PROPERTIES" | base64 --decode > local.properties
          else
            echo "LOCAL_PROPERTIES secret was not found"
            echo "Creating SDK configuration only"

            cat > local.properties << EOF
          sdk.dir=$ANDROID_HOME
          EOF
          fi

          echo "===== local.properties created ====="
          sed \
            -e 's/TELEGRAM_APP_ID=.*/TELEGRAM_APP_ID=***HIDDEN***/' \
            -e 's/TELEGRAM_APP_HASH=.*/TELEGRAM_APP_HASH=***HIDDEN***/' \
            -e 's/KEYSTORE_PASS=.*/KEYSTORE_PASS=***HIDDEN***/' \
            -e 's/ALIAS_PASS=.*/ALIAS_PASS=***HIDDEN***/' \
            local.properties || true


      # =========================
      # 11. MAKE SCRIPTS EXECUTABLE
      # =========================
      - name: Make build scripts executable
        run: |
          chmod +x ./gradlew

          if [ -f "./run" ]; then
            chmod +x ./run
          fi


      # =========================
      # 12. INITIALIZE LIBRARIES
      # =========================
      - name: Initialize native libraries
        run: |
          if [ -f "./run" ]; then
            ./run init libs
          else
            echo "ERROR: ./run script was not found"
            exit 1
          fi


      # =========================
      # 13. BUILD NATIVE LIBRARIES
      # =========================
      - name: Build native dependencies
        run: |
          ./run libs native


      # =========================
      # 14. SHOW AVAILABLE TASKS
      # =========================
      - name: Show Gradle tasks
        run: |
          ./gradlew tasks --all


      # =========================
      # 15. BUILD DEBUG APK
      # =========================
      - name: Build NayaGram APK
        run: |
          ./gradlew assembleAfatDebug \
            --stacktrace \
            --info \
            --no-daemon


      # =========================
      # 16. FIND GENERATED APK
      # =========================
      - name: Find generated APK files
        if: always()
        run: |
          echo "===== SEARCHING FOR APK FILES ====="
          find . -type f -name "*.apk" -print || true


      # =========================
      # 17. UPLOAD BUILD LOGS IF FAILED
      # =========================
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-Build-Reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # =========================
      # 18. UPLOAD APK
      # =========================
      - name: Upload NayaGram APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
