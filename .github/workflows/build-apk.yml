name: Build NayaGram Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build NayaGram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ==========================================
      # 1. CHECKOUT NAYAGRAM SOURCE
      # ==========================================
      - name: Checkout NayaGram source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0


      # ==========================================
      # 2. SETUP JAVA
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. SETUP ANDROID SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. ACCEPT ANDROID LICENSES
      # ==========================================
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true


      # ==========================================
      # 5. INSTALL LINUX BUILD DEPENDENCIES
      # ==========================================
      - name: Install native build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            ninja-build \
            yasm \
            golang-go \
            git \
            unzip \
            zip \
            pkg-config \
            autoconf \
            automake \
            libtool


      # ==========================================
      # 6. INSTALL ANDROID BUILD COMPONENTS
      # ==========================================
      - name: Install Android build components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1"


      # ==========================================
      # 7. CONFIGURE ANDROID ENVIRONMENT
      # ==========================================
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "NINJA_PATH=$(which ninja)" >> "$GITHUB_ENV"

          echo "===== ANDROID ENVIRONMENT ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK PATH=$ANDROID_HOME/ndk/21.4.7075529"

          java -version
          cmake --version
          ninja --version


      # ==========================================
      # 8. CHECK PROJECT STRUCTURE
      # ==========================================
      - name: Check project structure
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la

          echo ""
          echo "===== SEARCHING FOR GRADLE FILES ====="
          find . -maxdepth 3 \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" -o \
               -name "build.gradle" -o \
               -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "===== IMPORTANT FOLDERS ====="
          ls -la TMessagesProj || true
          ls -la TMessagesProj_App || true

          echo ""
          echo "===== BUILD SCRIPT ====="
          ls -la gradlew || true
          ls -la run || true


      # ==========================================
      # 9. INITIALIZE GIT SUBMODULES
      # ==========================================
      - name: Initialize Git submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "===== SUBMODULE STATUS ====="
          git submodule status --recursive || true


      # ==========================================
      # 10. CREATE LOCAL.PROPERTIES
      # ==========================================
      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/21.4.7075529
          EOF

          echo "===== local.properties ====="
          cat local.properties


      # ==========================================
      # 11. MAKE BUILD SCRIPTS EXECUTABLE
      # ==========================================
      - name: Make build scripts executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          if [ -f "./run" ]; then
            chmod +x ./run
          fi

          echo "===== PERMISSIONS ====="
          ls -la gradlew || true
          ls -la run || true


      # ==========================================
      # 12. VERIFY BUILD SCRIPTS
      # ==========================================
      - name: Verify build scripts
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found in the repository root"
            exit 1
          fi

          echo "Gradle wrapper found successfully"

          if [ -f "./run" ]; then
            echo "Native build script found"
            echo "===== RUN SCRIPT INFO ====="
            file ./run || true
            head -n 20 ./run || true
          else
            echo "No ./run script found"
            echo "Native script step will be skipped"
          fi


      # ==========================================
      # 13. INITIALIZE NATIVE LIBRARIES
      # ==========================================
      - name: Initialize native libraries
        if: success()
        run: |
          set -o pipefail

          if [ -f "./run" ]; then
            echo "===== INITIALIZING NATIVE LIBRARIES ====="

            ./run init libs 2>&1 | tee native-init.log

            EXIT_CODE=${PIPESTATUS[0]}

            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "ERROR: Native library initialization failed"
              echo "===== LAST 100 LINES ====="
              tail -n 100 native-init.log || true
              exit "$EXIT_CODE"
            fi
          else
            echo "Skipping native library initialization"
          fi


      # ==========================================
      # 14. BUILD NATIVE DEPENDENCIES
      # ==========================================
      - name: Build native dependencies
        if: success()
        run: |
          set -o pipefail

          if [ -f "./run" ]; then
            echo "===== BUILDING NATIVE DEPENDENCIES ====="

            ./run libs native 2>&1 | tee native-build.log

            EXIT_CODE=${PIPESTATUS[0]}

            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "ERROR: Native dependency build failed"
              echo "===== LAST 100 LINES ====="
              tail -n 100 native-build.log || true
              exit "$EXIT_CODE"
            fi
          else
            echo "Skipping native dependency build"
          fi


      # ==========================================
      # 15. CHECK GRADLE VERSION
      # ==========================================
      - name: Check Gradle version
        run: |
          ./gradlew --version --no-daemon


      # ==========================================
      # 16. SHOW AVAILABLE GRADLE TASKS
      # ==========================================
      - name: Show Gradle tasks
        run: |
          ./gradlew tasks --all --no-daemon 2>&1 | tee gradle-tasks.log


      # ==========================================
      # 17. BUILD NAYAGRAM DEBUG APK
      # ==========================================
      - name: Build NayaGram APK
        run: |
          set -o pipefail

          ./gradlew assembleAfatDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            echo "===== LAST 150 LINES ====="
            tail -n 150 gradle-build.log || true
            exit "$EXIT_CODE"
          fi


      # ==========================================
      # 18. FIND GENERATED APK FILES
      # ==========================================
      - name: Find generated APK files
        if: always()
        run: |
          echo "===== SEARCHING FOR APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            -print || true


      # ==========================================
      # 19. UPLOAD ALL BUILD LOGS
      # ==========================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-Build-Logs
          path: |
            native-init.log
            native-build.log
            gradle-tasks.log
            gradle-build.log
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # ==========================================
      # 20. UPLOAD NAYAGRAM APK
      # ==========================================
      - name: Upload NayaGram APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
