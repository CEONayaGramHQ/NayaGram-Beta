name: Build NayaGram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Required NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "APP_ID=0" > local.properties
          echo "APP_HASH=00000000000000000000000000000000" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK without native lib conflicts
        run: |
          ./gradlew assembleAfatDebug \
            -Pandroid.keepTimestampsInApk=true \
            -Pandroid.stripDebugSymbol.enable=false \
            -Pandroid.packagingOptions.pickFirsts="**/*.so" \
            --no-daemon --stacktrace

      - name: Upload NayaGram APK
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-APK
          path: "**/build/outputs/apk/**/*.apk"          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK without stripping
        run: ./gradlew assembleAfatDebug -Pandroid.keepTimestampsInApk=true -Pandroid.stripDebugSymbol.enable=false --no-daemon --stacktrace

      - name: Upload NayaGram APK
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-APK
          path: "**/build/outputs/apk/**/*.apk"
